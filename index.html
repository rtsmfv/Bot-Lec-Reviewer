<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root{
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#0F1913; --surface:#172419; --fg:#E3EDE5; --muted:#93AA9A; --line:#2A3B2F;
  --accent:#5EC08A; --accent-fg:#08150D; --accent-soft:#1E3A2A;
  --good:#6FD39A; --good-bg:#17382A; --bad:#F0907C; --bad-bg:#3D201B;
  --t-tf:#8DB4F0; --t-tf-bg:#1D2B42; --t-mc:#E6B864; --t-mc-bg:#3A2D14; --t-ty:#C3A3EE; --t-ty-bg:#2C2140;
  --display:"Space Grotesk",system-ui,-apple-system,sans-serif;
  --body:"Inter",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font:15px/1.5 var(--body);
  padding-block:18px 44px;
  padding-left:max(14px,env(safe-area-inset-left,0px));
  padding-right:max(14px,env(safe-area-inset-right,0px));
}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(28px,6vw,42px);line-height:1.05;font-weight:700}
.eyebrow{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.lede{color:var(--muted);margin:10px 0 0;max-width:60ch;font-size:15px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:14px}
.panel h2{font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
.link{background:none;border:0;color:var(--accent);font:500 13px var(--body);cursor:pointer;padding:2px 0;text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font:500 13px var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;min-height:34px}
.chip .n{font:500 11px var(--mono);color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.85}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{font:600 15px var(--body);background:var(--accent);color:var(--accent-fg);border:0;border-radius:10px;padding:11px 20px;cursor:pointer;min-height:42px}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sum{font:500 12px var(--mono);color:var(--muted);margin-top:8px}
.tag{font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;display:inline-block}
.tag.tf{background:var(--t-tf-bg);color:var(--t-tf)}
.tag.mc{background:var(--t-mc-bg);color:var(--t-mc)}
.tag.ty{background:var(--t-ty-bg);color:var(--t-ty)}
.tag.topic{background:var(--accent-soft);color:var(--accent)}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qhead{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:8px;font:500 12px var(--mono);color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:12px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.q{font:600 clamp(17px,4vw,22px)/1.32 var(--display);margin:0 0 14px;text-wrap:pretty}
.passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:12px}
.passage .ptitle{font:500 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.passage p{margin:0;font-size:13.5px;line-height:1.48;color:var(--fg);opacity:.92}
.stmts{display:grid;gap:7px;margin-bottom:14px}
.stmt{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:14px;line-height:1.4}
.stmt b{color:var(--accent);font-family:var(--display)}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;font:500 14.5px/1.35 var(--body);color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;width:100%;min-height:42px}
.opt .k{font:500 11.5px var(--mono);border:1px solid var(--line);border-radius:6px;min-width:24px;height:24px;display:grid;place-items:center;color:var(--muted);flex:none;background:var(--surface)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.good{background:var(--good-bg);border-color:var(--good);color:var(--fg)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.opt:disabled{cursor:default}
input.ans{width:100%;font:500 16px var(--body);padding:11px 13px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg)}
input.ans.good{border-color:var(--good);background:var(--good-bg)}
input.ans.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb{margin-top:14px;padding:11px 14px;border-radius:10px;font-size:14px;line-height:1.45}
.fb.good{background:var(--good-bg);border-left:4px solid var(--good)}
.fb.bad{background:var(--bad-bg);border-left:4px solid var(--bad)}
.fb b{font-family:var(--display)}
.fb .why{display:block;margin-top:3px;color:var(--fg)}
.srcnote{font:500 11px var(--mono);color:var(--muted);margin-top:12px}
.score{font:700 clamp(52px,14vw,88px)/1 var(--display);color:var(--accent)}
.breakdown{display:grid;gap:10px}
.brow{display:grid;grid-template-columns:minmax(0,180px) 1fr 58px;gap:10px;align-items:center;font-size:13.5px}
.brow .pc{font:500 12.5px var(--mono);text-align:right}
.miss{border-top:1px solid var(--line);padding:12px 0;font-size:14px}
.miss:first-child{border-top:0}
.miss p{margin:5px 0 0}
.miss .ya{color:var(--bad)}
.miss .ca{color:var(--good);font-weight:600}
@media (max-width:520px){
  body{padding-block:12px 32px}
  .brow{grid-template-columns:1fr 56px}
  .brow .bar{grid-column:1 / -1;order:3}
  .card{padding:14px}
  .q{margin-bottom:11px}
  .opt{padding:9px 11px;font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div id="home">
    <div class="eyebrow">BBIO101A &middot; End-term review</div>
    <h1>Leaf to Seed Quiz</h1>
    <p class="lede">Leaves, flowers, fruits and seeds. Study every major term, scientific name, structure, classification and concept from your lecture slides.</p>
    <p class="sum" id="bankSum"></p>

    <div class="panel"><h2><span>Topics</span><span><button class="link" id="allTopics">All</button> &middot; <button class="link" id="noTopics">None</button></span></h2><div class="chips" id="topicChips"></div></div>
    <div class="panel"><h2>Question types</h2><div class="chips" id="typeChips"></div></div>
    <div class="panel"><h2>Number of questions</h2><div class="chips" id="lenChips"></div></div>
    <div class="row" style="margin-top:18px"><button class="btn" id="start">Start quiz</button><span class="sum" id="poolSum" style="margin-top:0"></span></div>
  </div>

  <div id="quiz" hidden>
    <div class="qhead"><span id="qcount"></span><span id="qscore"></span></div>
    <div class="bar"><i id="qbar" style="width:0"></i></div>
    <div class="card">
      <div class="tags" id="qtags"></div>
      <div id="qpre"></div>
      <h2 class="q" id="qtext"></h2>
      <div id="qbody"></div>
      <div class="fb" id="fb" hidden aria-live="polite"></div>
      <div class="row" style="margin-top:14px"><button class="btn" id="primary">Check</button><button class="btn ghost" id="secondary" hidden>Show answer</button><button class="link" id="quit" style="margin-left:auto">End quiz</button></div>
      <div class="srcnote" id="qsrc"></div>
    </div>
  </div>

  <div id="results" hidden>
    <div class="eyebrow">BBIO101A &middot; Results</div>
    <div class="score" id="rScore"></div>
    <p class="lede" id="rLine"></p>
    <div class="panel"><h2>By question type</h2><div class="breakdown" id="byType"></div></div>
    <div class="panel"><h2>By topic</h2><div class="breakdown" id="byTopic"></div></div>
    <div class="panel"><h2>Missed questions</h2><div id="missed"></div></div>
    <div class="row" style="margin-top:18px"><button class="btn" id="retryMissed">Retry missed</button><button class="btn ghost" id="again">New quiz</button></div>
  </div>
</div>

<script>
const DATA={"mcq":[{"q":"Which scientific name belongs to sweet potato?","o":["Ipomoea batatas","Vanilla planifolia","Arachis hypogaea","Basella alba"],"a":0,"e":"The slides use Ipomoea batatas as an example of a petiolate leaf.","topic":"Leaf morphology","source":"pp. 1–20"},{"q":"Which plant is presented as having sessile leaves?","o":["Zingiber officinale","Vanilla planifolia","Pisum sativum","Codiaeum variegatum"],"a":1,"e":"Vanilla planifolia attaches its leaves without a distinct petiole.","topic":"Leaf morphology","source":"pp. 1–20"},{"q":"The scientific name of ginger in the leaf sheath example is:","o":["Zea mays","Musa × paradisiaca","Zingiber officinale","Allium cepa"],"a":2,"e":"Zingiber officinale is the ginger leaf-sheath example on slide 8.","topic":"Leaf morphology","source":"pp. 1–20"},{"q":"What structures overlap to form the banana pseudostem?","o":["Secondary roots","Leaf sheaths","Woody branches","Petal bases"],"a":1,"e":"Numerous overlapping leaf sheaths form the false aerial stem.","topic":"Leaf morphology","source":"pp. 1–20"},{"q":"What does stipulate mean?","o":["Lacking a leaf blade","Having paired basal appendages","Having a single midrib","Having no petiole"],"a":1,"e":"Stipules are paired appendages at a leaf base.","topic":"Leaf morphology","source":"pp. 1–20"},{"q":"Which example is described as exstipulate?","o":["Arachis hypogaea","Basella alba","Pisum sativum","Ipomoea batatas"],"a":1,"e":"Basella alba is the exstipulate example; Arachis hypogaea is stipulate.","topic":"Leaf morphology","source":"pp. 1–20"},{"q":"Which structure is the dominant primary vein from base to apex?","o":["Veinlet","Stipule","Midrib","Petiole"],"a":2,"e":"The midrib branches into lateral veins and smaller veinlets.","topic":"Leaf morphology","source":"pp. 1–20"},{"q":"Which scientific name refers to sugarcane?","o":["Saccharum officinarum","Zea mays","Oryza sativa","Triticum aestivum"],"a":0,"e":"Saccharum officinarum appears in the vascular-organization section.","topic":"Leaf morphology","source":"pp. 1–20"},{"q":"Which plant is shown as a reticulate venation example?","o":["Hamamelis","Zea mays","Carludovica palmata","Saccharum officinarum"],"a":0,"e":"The witch-hazel (Hamamelis) slide shows a netlike vein pattern.","topic":"Leaf morphology","source":"pp. 1–20"},{"q":"In garden pea, which structure is modified into a supporting tendril?","o":["Terminal leaflets","Sepals","Roots","Pollen sacs"],"a":0,"e":"The Pisum sativum slide explicitly states that terminal leaflets become tendrils.","topic":"Leaf modifications","source":"pp. 21–34"},{"q":"What is the scientific name of the garden pea example?","o":["Arachis hypogaea","Pisum sativum","Allium cepa","Basella alba"],"a":1,"e":"Pisum sativum illustrates leaf tendrils used for support.","topic":"Leaf modifications","source":"pp. 21–34"},{"q":"Which plant stores reserves in fleshy bulb leaves?","o":["Nepenthes","Bryophyllum daigremontianum","Allium cepa","Drosera capensis"],"a":2,"e":"Onion (Allium cepa) has fleshy storage leaves.","topic":"Leaf modifications","source":"pp. 21–34"},{"q":"Which taxon has pitcher leaves specialized for capturing insects?","o":["Nepenthes","Magnolia","Rhododendron","Arachis"],"a":0,"e":"Nepenthes has modified pitcher leaves used in nitrogen procurement.","topic":"Leaf modifications","source":"pp. 21–34"},{"q":"Which scientific name is given for a sundew?","o":["Dionaea muscipula","Drosera capensis","Musa × paradisiaca","Zingiber officinale"],"a":1,"e":"The source names Drosera capensis as the sundew example.","topic":"Leaf modifications","source":"pp. 21–34"},{"q":"Which plant produces tiny plantlets along leaf margins?","o":["Bryophyllum daigremontianum","Saccharum officinarum","Vanilla planifolia","Lactuca sativa"],"a":0,"e":"The Mother-of-Thousands leaf develops plantlets at its margins.","topic":"Leaf modifications","source":"pp. 21–34"},{"q":"Which tissue system comprises the epidermis and waxy cuticle?","o":["Ground","Vascular","Dermal","Reproductive"],"a":2,"e":"The dermal tissue system forms the protective exterior.","topic":"Leaf internal anatomy","source":"pp. 38–67"},{"q":"Which tissue carries water into a leaf?","o":["Phloem","Xylem","Cuticle","Spongy mesophyll"],"a":1,"e":"Xylem transports water and mineral nutrients through vascular bundles.","topic":"Leaf internal anatomy","source":"pp. 38–67"},{"q":"Which tissue exports sugars produced during photosynthesis?","o":["Phloem","Xylem","Epidermis","Cuticle"],"a":0,"e":"Phloem distributes sugars to other plant parts.","topic":"Leaf internal anatomy","source":"pp. 38–67"},{"q":"Which mesophyll is generally densely packed with elongated photosynthetic cells?","o":["Spongy mesophyll","Palisade mesophyll","Lower epidermis","Cuticle"],"a":1,"e":"Palisade mesophyll cells are a principal photosynthetic layer in dorsiventral leaves.","topic":"Leaf internal anatomy","source":"pp. 38–67"},{"q":"Which mesophyll contains many intercellular spaces that facilitate gas movement?","o":["Spongy mesophyll","Palisade mesophyll","Upper cuticle","Vascular cambium"],"a":0,"e":"Spongy mesophyll typically contains open air spaces.","topic":"Leaf internal anatomy","source":"pp. 38–67"},{"q":"Which plant is cited as an example of an isobilateral leaf?","o":["Zea mays","Hamamelis","Ipomoea batatas","Basella alba"],"a":0,"e":"The monocot example Zea mays is used for isobilateral anatomy.","topic":"Leaf internal anatomy","source":"pp. 38–67"},{"q":"What is the collective term for a flower’s sepals?","o":["Corolla","Androecium","Calyx","Gynoecium"],"a":2,"e":"The calyx is the outer whorl composed of sepals.","topic":"Flowers","source":"pp. 69–107"},{"q":"What is the collective term for the petals?","o":["Calyx","Corolla","Gynoecium","Pericarp"],"a":1,"e":"Corolla names the petal whorl.","topic":"Flowers","source":"pp. 69–107"},{"q":"What floral structure is made of an anther and filament?","o":["Stamen","Pistil","Sepal","Ovule"],"a":0,"e":"A stamen is a male floral organ consisting of anther and filament.","topic":"Flowers","source":"pp. 69–107"},{"q":"Which set forms the pistil?","o":["Sepal, petal, receptacle","Anther, filament, pollen","Ovary, style, stigma","Exocarp, mesocarp, endocarp"],"a":2,"e":"A pistil consists of stigma, style, and ovary.","topic":"Flowers","source":"pp. 69–107"},{"q":"Which thinker proposed the foliar theory of the flower in 1790?","o":["Gregor Mendel","Johann Wolfgang von Goethe","Charles Darwin","Robert Hooke"],"a":1,"e":"Goethe proposed that floral whorls are modifications of a common leaf-like organ.","topic":"Flowers","source":"pp. 69–107"},{"q":"Which finding supports the foliar theory presented in the slides?","o":["Homeotic floral organs can become leaflike","All leaves are flowers","Petals contain seeds","Only monocots have flowers"],"a":0,"e":"The slides cite homeotic mutants that replace floral organ identities with leaflike structures.","topic":"Flowers","source":"pp. 69–107"},{"q":"Which structure develops into the fruit wall after maturation?","o":["Ovule","Ovary wall","Stigma","Anther"],"a":1,"e":"The mature ovary wall becomes the pericarp.","topic":"Fruits and seeds","source":"pp. 108–137"},{"q":"Which set correctly lists the pericarp layers?","o":["Epidermis, palisade, spongy","Stigma, style, ovary","Exocarp, mesocarp, endocarp","Calyx, corolla, androecium"],"a":2,"e":"The pericarp has outer exocarp, middle mesocarp, and inner endocarp.","topic":"Fruits and seeds","source":"pp. 108–137"},{"q":"A fruit developing from one flower with several separate carpels is classified as:","o":["Multiple","Aggregate","Simple","Seedless"],"a":1,"e":"Aggregate fruits arise from unfused carpels of a single flower.","topic":"Fruits and seeds","source":"pp. 108–137"},{"q":"A fruit developing from an entire inflorescence is classified as:","o":["Simple","Aggregate","Multiple","Drupe only"],"a":2,"e":"Multiple fruits develop from several flowers together.","topic":"Fruits and seeds","source":"pp. 108–137"},{"q":"Which fruit is identified in the slides as a drupe?","o":["Cocos nucifera (coconut)","Pineapple","Mulberry","Raspberry"],"a":0,"e":"The fruit module identifies coconut (Cocos nucifera) as a drupe.","topic":"Fruits and seeds","source":"pp. 108–137"},{"q":"Which distinction concerns dry-fruit opening at maturity?","o":["Dorsiventral vs isobilateral","Dehiscent vs indehiscent","Petiolate vs sessile","Stipulate vs exstipulate"],"a":1,"e":"Dehiscent fruits open for seed release; indehiscent fruits do not split open at maturity.","topic":"Fruits and seeds","source":"pp. 108–137"},{"q":"Which is an example of a multiple fruit in the slides?","o":["Pineapple","Raspberry","Coconut","Pea pod"],"a":0,"e":"Pineapple develops from an inflorescence, not one pistil.","topic":"Fruits and seeds","source":"pp. 108–137"},{"q":"Which paired scientific name and common name is correct?","o":["Zea mays — corn","Allium cepa — pea","Pisum sativum — onion","Vanilla planifolia — sugarcane"],"a":0,"e":"Zea mays is corn, Allium cepa onion, Pisum sativum garden pea.","topic":"Scientific names","source":"Examples throughout the PDF"},{"q":"Which term best matches this description? The tip of the lamina.","o":["Apex","Leaf sheath","Pseudostem","Adaxial surface"],"a":0,"e":"Apex — The tip of the lamina.","topic":"Leaf morphology","source":"pp. 1–20"},{"q":"Which term best matches this description? The outer edge of the leaf blade.","o":["Axillary bud","Margin","Shoot apical meristem","Lateral veins"],"a":1,"e":"Margin — The outer edge of the leaf blade.","topic":"Leaf morphology","source":"pp. 1–20"},{"q":"Which term best matches this description? The lower part of the blade nearest its attachment.","o":["Apex","Abaxial surface","Stipulate","Leaf base"],"a":3,"e":"Leaf base — The lower part of the blade nearest its attachment.","topic":"Leaf morphology","source":"pp. 1–20"},{"q":"Which term best matches this description? The angle between a leaf and the stem.","o":["Abaxial surface","Axillary bud","Axil","Leaf base"],"a":2,"e":"Axil — The angle between a leaf and the stem.","topic":"Leaf morphology","source":"pp. 1–20"},{"q":"Which term best matches this description? Secondary veins branching from the midrib.","o":["Lateral veins","Shoot apical meristem","Adaxial surface","Abaxial surface"],"a":0,"e":"Lateral veins — Secondary veins branching from the midrib.","topic":"Leaf morphology","source":"pp. 1–20"},{"q":"Which term best matches this description? The finest branches of the leaf venation network.","o":["Margin","Veinlets","Leaf sheath","Venation"],"a":1,"e":"Veinlets — The finest branches of the leaf venation network.","topic":"Leaf morphology","source":"pp. 1–20"},{"q":"Which term best matches this description? An expanded leaf base that wraps around the stem axis.","o":["Adaxial surface","Apex","Leaf base","Leaf sheath"],"a":3,"e":"Leaf sheath — An expanded leaf base that wraps around the stem axis.","topic":"Leaf morphology","source":"pp. 1–20"},{"q":"Which term best matches this description? The false stem supported by closely overlapping leaf sheaths.","o":["Pseudostem","Venation","Leaf primordium","Leaf base"],"a":0,"e":"Pseudostem — The false stem supported by closely overlapping leaf sheaths.","topic":"Leaf morphology","source":"pp. 1–20"},{"q":"Which term best matches this description? A leaf condition with paired basal stipules.","o":["Leaf base","Reticulate venation","Lateral veins","Stipulate"],"a":3,"e":"Stipulate — A leaf condition with paired basal stipules.","topic":"Leaf morphology","source":"pp. 1–20"},{"q":"Which term best matches this description? The pattern of vascular veins in a lamina.","o":["Axil","Venation","Abaxial surface","Leaf base"],"a":1,"e":"Venation — The pattern of vascular veins in a lamina.","topic":"Leaf morphology","source":"pp. 1–20"},{"q":"Which term best matches this description? A vein pattern with veins extending alongside one another.","o":["Stipulate","Axil","Parallel venation","Pseudostem"],"a":2, iolate attachment.","B":"Vanilla planifolia leaves are petiolate because they have long leaf stalks.","a":1,"e":"A is true: sweet potato has petiolate leaves. B is false: vanilla is the sessile example.","topic":"Leaf morphology","source":"pp. 1–20"},{"p":0,"A":"A leaf sheath is a modified leaf base that wraps around a stem.","B":"Banana pseudostems form mainly from overlapping woody stems.","a":1,"e":"A is true; the sheath surrounds the axis. B is false; overlapping leaf sheaths form the banana pseudostem.","topic":"Leaf morphology","source":"pp. 1–20"},{"p":0,"A":"A sessile leaf lacks a distinct petiole.","B":"A petiolate leaf attaches directly without a stalk.","a":1,"e":"A correctly defines sessile; B actually defines sessile, not petiolate.","topic":"Leaf morphology","source":"pp. 1–20"},{"p":0,"A":"Ginger is presented as an example of a leaf sheath.","B":"The banana pseudostem is a true woody aerial stem.","a":1,"e":"Ginger illustrates sheathing; the banana pseudostem is a false stem.","topic":"Leaf morphology","source":"pp. 1–20"},{"p":1,"A":"Garden pea terminal leaflets may become tendrils.","B":"The tendrils help the plant climb by coiling around supports.","a":0,"e":"Both statements match the pea tendril example.","topic":"Leaf modifications","source":"pp. 21–34"},{"p":1,"A":"Onion fleshy bulb leaves primarily serve a storage role.","B":"The slides describe those subterranean fleshy leaves as the main photosynthetic organs.","a":1,"e":"A is true. The slides describe fleshy subterranean onion leaves as non-photosynthetic storage organs.","topic":"Leaf modifications","source":"pp. 21–34"},{"p":1,"A":"Nepenthes traps aid nitrogen procurement.","B":"Bryophyllum plantlets originate along leaf margins.","a":0,"e":"Both are specialized leaf functions listed in the source.","topic":"Leaf modifications","source":"pp. 21–34"},{"p":1,"A":"Pea tendrils are modified roots.","B":"Pitcher leaves primarily obtain nitrogen by capturing insects.","a":2,"e":"A is false because the pea terminal leaflets form tendrils; B is true.","topic":"Leaf modifications","source":"pp. 21–34"},{"p":2,"A":"The cuticle and epidermis are part of the dermal tissue system.","B":"Xylem is responsible for transporting manufactured sugars away from the leaf.","a":1,"e":"The first is true; sugar export is associated with phloem rather than xylem.","topic":"Leaf internal anatomy","source":"pp. 38–67"},{"p":2,"A":"Spongy mesophyll contains air spaces supporting gas exchange.","B":"Palisade mesophyll is a densely packed photosynthetic layer.","a":0,"e":"Both describe the specialization of the two mesophyll regions.","topic":"Leaf internal anatomy","source":"pp. 38–67"},{"p":2,"A":"Stomata are pores involved in leaf gas exchange.","B":"Phloem functions chiefly in transporting water into leaves.","a":1,"e":"A true, B false: water transport is xylem; phloem carries sugars.","topic":"Leaf internal anatomy","source":"pp. 38–67"},{"p":2,"A":"Palisade mesophyll is found exclusively outside the epidermis.","B":"The cuticle is the principal vascular tissue of the leaf.","a":3,"e":"Both are false: palisade is internal ground tissue; the cuticle is a protective covering.","topic":"Leaf internal anatomy","source":"pp. 38–67"},{"p":3,"A":"The calyx comprises the sepals.","B":"The corolla comprises the petals.","a":0,"e":"Both definitions are correct.","topic":"Flowers","source":"pp. 69–107"},{"p":3,"A":"The pistil contains the stigma, style, and ovary.","B":"A stamen consists of an anther and filament.","a":0,"e":"Both correctly identify floral organs.","topic":"Flowers","source":"pp. 69–107"},{"p":3,"A":"Goethe proposed floral whorls as modified leaflike organs.","B":"Homeotic floral mutants never alter organ identities.","a":1,"e":"Goethe’s proposal is accurate; homeotic mutants can change floral organ identities.","topic":"Flowers","source":"pp. 69–107"},{"p":3,"A":"The corolla is the collective name for stamens.","B":"The calyx is the collective name for petals.","a":3,"e":"Both definitions are swapped: corolla = petals; calyx = sepals.","topic":"Flowers","source":"pp. 69–107"},{"p":4,"A":"Exocarp, mesocarp, and endocarp are layers of the pericarp.","B":"An aggregate fruit develops from the entire inflorescence.","a":1,"e":"A true. B describes multiple fruits, not aggregate fruits.","topic":"Fruits and seeds","source":"pp. 108–137"},{"p":4,"A":"Pineapple is an example of a multiple fruit.","B":"An aggregate fruit arises from separate carpels within one flower.","a":0,"e":"Both match the fruit-origin classification.","topic":"Fruits and seeds","source":"pp. 108–137"},{"p":4,"A":"Dehiscent fruits split open for seed release.","B":"Indehiscent fruits also split open at maturity by definition.","a":1,"e":"Only A is true; indehiscent means not opening naturally at maturity.","topic":"Fruits and seeds","source":"pp. 108–137"},{"p":4,"A":"Cocos nucifera is identified as a drupe.","B":"The pericarp develops from the mature ovary wall.","a":0,"e":"Both statements are supported by the fruit slides.","topic":"Fruits and seeds","source":"pp. 108–137"},{"p":4,"A":"A multiple fruit arises from a single carpel of one flower.","B":"The mesocarp is the outermost pericarp layer.","a":3,"e":"Both false: multiple fruits arise from inflorescences; the outer layer is the exocarp.","topic":"Fruits and seeds","source":"pp. 108–137"},{"p":5,"A":"The midrib is the dominant primary vein.","B":"Lateral veins are usually thicker than the midrib.","a":1,"e":"A true: midrib is primary. B false: lateral veins are finer branches.","topic":"Leaf morphology","source":"pp. 1–20"},{"p":5,"A":"The adaxial surface is on the upper side.","B":"The abaxial surface is on the lower side.","a":0,"e":"Both surface labels are correct.","topic":"Leaf morphology","source":"pp. 1–20"},{"p":5,"A":"The apex describes the base of the leaf.","B":"The margin identifies the central vein.","a":3,"e":"A false: apex is the tip. B false: margin is the blade edge.","topic":"Leaf morphology","source":"pp. 1–20"},{"p":5,"A":"The axil is the angle formed by leaf and stem.","B":"Veinlets are finer branches than lateral veins.","a":0,"e":"Both correctly describe leaf morphology.","topic":"Leaf morphology","source":"pp. 1–20"},{"p":5,"A":"Veinlets are the main central vascular strand.","B":"A leaf margin is the edge of the lamina.","a":2,"e":"A false: midrib is primary. B true: margin is the blade edge.","topic":"Leaf morphology","source":"pp. 1–20"},{"p":6,"A":"A leaf without a petiole is sessile.","B":"A leaf with stipules is exstipulate.","a":1,"e":"A true. B false: stipulate means having stipules.","topic":"Leaf morphology","source":"pp. 1–20"},{"p":6,"A":"Groundnut illustrates stipulate leaves.","B":"Basella illustrates leaves without stipules.","a":0,"e":"Both examples appear in the slides.","topic":"Leaf morphology","source":"pp. 1–20"},{"p":6,"A":"The banana pseudostem is produced by leaf sheaths.","B":"A pseudostem must contain a woody true aerial stem.","a":1,"e":"A true; B false, it is a false stem.","topic":"Leaf morphology","source":"pp. 1–20"},{"p":6,"A":"A leaf sheath is a modified leaf base.","B":"A leaf sheath is made from petals.","a":1,"e":"A true; B false: sheaths originate from leaves.","topic":"Leaf morphology","source":"pp. 1–20"},{"p":6,"A":"Vanilla is shown as petiolate.","B":"Sweet potato is shown as sessile.","a":3,"e":"Both are reversed in this lecture.","topic":"Leaf morphology","source":"pp. 1–20"},{"p":7,"A":"Pea terminal leaflets can form tendrils.","B":"The purpose of pea tendrils is mainly seed dispersal.","a":1,"e":"A true. B false: tendrils give mechanical support.","topic":"Leaf modifications","source":"pp. 21–34"},{"p":7,"A":"Onion fleshy bulb leaves are for storage.","B":"A pitcher plant gains nitrogen from captured prey.","a":0,"e":"Both are accurate.","topic":"Leaf modifications","source":"pp. 21–34"},{"p":7,"A":"Bryophyllum can reproduce via leaf-margin plantlets.","B":"Leaf-margin plantlets necessarily develop from flower ovaries.","a":1,"e":"A true; B false, these form from leaf growth tissues.","topic":"Leaf modifications","source":"pp. 21–34"},{"p":7,"A":"Pea tendrils cannot respond to touch.","B":"A stem tendril and leaf tendril have identical organ origins.","a":3,"e":"Both false: tendrils respond to contact, and their origins differ.","topic":"Leaf modifications","source":"pp. 21–34"},{"p":7,"A":"The outer dry onion scales and fleshy inner leaves have identical functions.","B":"Nitrogen-trapping leaves may occur in low-nitrate habitats.","a":2,"e":"A false: outer scales protect; fleshy inner leaves store. B true.","topic":"Leaf modifications","source":"pp. 21–34"},{"p":8,"A":"Guard cells regulate stomatal opening.","B":"The cuticle belongs to the vascular system.","a":1,"e":"A true: guard cells act on stomata. B false: cuticle is protective dermal covering.","topic":"Leaf internal anatomy","source":"pp. 38–67"},{"p":8,"A":"Mesophyll is ground tissue.","B":"Palisade cells generally have a photosynthetic role.","a":0,"e":"Both correct.","topic":"Leaf internal anatomy","source":"pp. 38–67"},{"p":8,"A":"Xylem distributes sugars out of leaves.","B":"Phloem is the main water-conducting leaf tissue.","a":3,"e":"Both functions are reversed.","topic":"Leaf internal anatomy","source":"pp. 38–67"},{"p":8,"A":"Spongy mesophyll has air spaces.","B":"These air spaces facilitate internal gas movement.","a":0,"e":"Both true.","topic":"Leaf internal anatomy","source":"pp. 38–67"},{"p":8,"A":"Stomata are located within leaf epidermal tissue.","B":"The dermal system is mainly concerned with sugar transport.","a":1,"e":"A true. B false: transport is vascular tissue.","topic":"Leaf internal anatomy","source":"pp. 38–67"},{"p":9,"A":"Isobilateral means the two faces are structurally similar.","B":"Dorsiventral refers to distinct top and bottom organization.","a":0,"e":"Both definitions are accurate.","topic":"Leaf internal anatomy","source":"pp. 38–67"},{"p":9,"A":"The slides associate Zea mays with isobilateral anatomy.","B":"The slides associate sunflower with dorsiventral anatomy.","a":0,"e":"Both slide examples match.","topic":"Leaf internal anatomy","source":"pp. 38–67"},{"p":9,"A":"A dorsiventral leaf must have identical mesophyll on both sides.","B":"Isobilateral anatomy requires upper and lower cell layers to differ radically.","a":3,"e":"Both definitions are reversed.","topic":"Leaf internal anatomy","source":"pp. 38–67"},{"p":9,"A":"A dicot leaf can show differentiated palisade and spongy tissues.","B":"A monocot leaf may show a more uniform mesophyll arrangement.","a":0,"e":"Both are broad patterns in the lecture.","topic":"Leaf internal anatomy","source":"pp. 38–67"},{"p":9,"A":"Dorsiventral differentiation is linked with horizontal light capture.","B":"Isobilateral organization is associated with more vertical leaves.","a":0,"e":"Both associations are in the diagrams.","topic":"Leaf internal anatomy","source":"pp. 38–67"},{"p":10,"A":"The calyx consists of sepals.","B":"The corolla consists of petals.","a":0,"e":"Both correct.","topic":"Flowers","source":"pp. 69–107"},{"p":10,"A":"A perfect flower must have all four whorls.","B":"An incomplete flower cannot be bisexual.","a":3,"e":"Both false: perfect is about both sexes; incomplete is about missing any whorl.","topic":"Flowers","source":"pp. 69–107"},{"p":10,"A":"A stamen includes an anther.","B":"A pistil includes a stigma.","a":0,"e":"Both accurate.","topic":"Flowers","source":"pp. 69–107"},{"p":10,"A":"Pistillate flowers have female organs.","B":"Staminate flowers have male organs.","a":0,"e":"Both definitions correct.","topic":"Flowers","source":"pp. 69–107"},{"p":10,"A":"An incomplete flower lacks at least one floral whorl.","B":"A flower lacking petals may still have both stamens and carpels.","a":0,"e":"Both true; incompleteness and flower sex are different axes.","topic":"Flowers","source":"pp. 69–107"},{"p":10,"A":"The androecium is the female organ collection.","B":"The gynoecium consists of stamens.","a":3,"e":"Both are swapped: androecium male, gynoecium female.","topic":"Flowers","source":"pp. 69–107"},{"p":11,"A":"United carpels form a syncarpous gynoecium.","B":"Separate carpels form an apocarpous gynoecium.","a":0,"e":"Both correspond to the lecture definitions.","topic":"Flowers","source":"pp. 69–107"},{"p":11,"A":"Pedicellate flowers have an individual flower stalk.","B":"Sessile flowers lack a pedicel.","a":0,"e":"Both correct.","topic":"Flowers","source":"pp. 69–107"},{"p":11,"A":"Subsessile refers to a very short pedicel.","B":"Apocarpous means the carpels are united.","a":1,"e":"A true; B false: apocarpous carpels are separate.","topic":"Flowers","source":"pp. 69–107"},{"p":11,"A":"A pedicel is the same as an anther.","B":"A sessile flower necessarily has a long pedicel.","a":3,"e":"Both false.","topic":"Flowers","source":"pp. 69–107"},{"p":11,"A":"The stigma is the pollen-receptive part.","B":"The style may be absent in some pistils.","a":0,"e":"Both statements are supported by the flower definitions.","topic":"Flowers","source":"pp. 69–107"},{"p":12,"A":"A+B specifies petals.","B":"B+C specifies stamens.","a":0,"e":"Both combinations are correct.","topic":"Flowers","source":"pp. 69–107"},{"p":12,"A":"C alone specifies the outermost sepals.","B":"A alone specifies innermost carpels.","a":3,"e":"Both positions and gene combinations are reversed.","topic":"Flowers","source":"pp. 69–107"},{"p":12,"A":"A B-loss mutant can produce sepals in whorl 2.","B":"A B-loss mutant can produce carpels in whorl 3.","a":0,"e":"Both replacement identities are described in the supplied lesson.","topic":"Flowers","source":"pp. 69–107"},{"p":12,"A":"Homeotic changes can replace one floral organ with another.","B":"The ABC model links gene activity with whorl identity.","a":0,"e":"Both are core ideas of the lesson.","topic":"Flowers","source":"pp. 69–107"},{"p":12,"A":"Goethe proposed floral organ modification from leaflike primordia.","B":"Conical petal epidermal cells can intensify displayed colors.","a":0,"e":"Both are explicitly described.","topic":"Flowers","source":"pp. 69–107"},{"p":12,"A":"Petal vascular bundles can resemble simplified leaf veins.","B":"Petals must always photosynthesize more than foliage leaves.","a":1,"e":"A true. B false: petals often specialize in attraction rather than photosynthesis.","topic":"Flowers","source":"pp. 69–107"},{"p":13,"A":"Anther meiosis produces microspores.","B":"Ovule development involves megaspore formation.","a":0,"e":"Both accurate.","topic":"Flowers","source":"pp. 69–107"},{"p":13,"A":"The sporophyte is diploid.","B":"The gametophyte is haploid.","a":0,"e":"Both are the defining ploidy levels.","topic":"Flowers","source":"pp. 69–107"},{"p":13,"A":"A pollen tube is used to transport sperm.","B":"Endosperm is a product of double fertilization.","a":0,"e":"Both are accurate.","topic":"Flowers","source":"pp. 69–107"},{"p":13,"A":"A zygote is a mature dry fruit.","B":"Meiosis directly produces two identical diploid cells.","a":3,"e":"Both false: a zygote is fertilized cell, and meiosis produces haploid products.","topic":"Flowers","source":"pp. 69–107"},{"p":13,"A":"The embryo sac is the female gametophyte.","B":"A pollen grain is part of the male reproductive pathway.","a":0,"e":"Both correct.","topic":"Flowers","source":"pp. 69–107"},{"p":14,"A":"The pericarp develops from the ovary wall.","B":"Ovules can develop into seeds after fertilization.","a":0,"e":"Both correct.","topic":"Fruits and seeds","source":"pp. 108–137"},{"p":14,"A":"The exocarp is the innermost pericarp layer.","B":"The endocarp is the fruit skin.","a":3,"e":"Both are swapped.","topic":"Fruits and seeds","source":"pp. 108–137"},{"p":14,"A":"The mesocarp lies between the exocarp and endocarp.","B":"The outermost fruit layer is exocarp.","a":0,"e":"Both correct.","topic":"Fruits and seeds","source":"pp. 108–137"},{"p":14,"A":"The placenta is associated with ovule attachment.","B":"The funiculus connects ovule or seed to placental tissue.","a":0,"e":"Both describe the tomato anatomical structures.","topic":"Fruits and seeds","source":"pp. 108–137"},{"p":14,"A":"The fruit wall is called the calyx.","B":"A fruit develops from stamens rather than ovaries.","a":3,"e":"Both false: pericarp is fruit wall, developing from ovary tissue.","topic":"Fruits and seeds","source":"pp. 108–137"},{"p":15,"A":"Criterion 1 considers floral origin.","B":"Criterion 2 considers pericarp texture.","a":0,"e":"Both match the decision pipeline.","topic":"Fruits and seeds","source":"pp. 108–137"},{"p":15,"A":"Criterion 3 concerns dry-fruit seed release.","B":"Criterion 4 concerns pericarp layer modifications.","a":0,"e":"Both match the lecture pipeline.","topic":"Fruits and seeds","source":"pp. 108–137"},{"p":15,"A":"Aggregate fruit is formed from many flowers.","B":"Multiple fruit is formed from separate carpels of only one flower.","a":3,"e":"Both descriptions are swapped.","topic":"Fruits and seeds","source":"pp. 108–137"},{"p":15,"A":"Pineapple is a multiple fruit.","B":"An aggregate fruit arises from one flower with many unfused carpels.","a":0,"e":"Both correct.","topic":"Fruits and seeds","source":"pp. 108–137"},{"p":15,"A":"A simple fruit arises from a single pistil in one flower.","B":"Fleshy fruits retain hydrated pericarp at maturity.","a":0,"e":"Both accurate.","topic":"Fruits and seeds","source":"pp. 108–137"},{"p":15,"A":"Dehiscent fruits normally split open to release seeds.","B":"Indehiscent fruits normally remain closed at maturity.","a":0,"e":"Both definitions accurate.","topic":"Fruits and seeds","source":"pp. 108–137"},{"p":16,"A":"A capsule belongs to the dehiscent group in the slide.","B":"A follicle belongs to the dehiscent group.","a":0,"e":"Both on the lecture list.","topic":"Fruits and seeds","source":"pp. 108–137"},{"p":16,"A":"A samara is listed as indehiscent.","B":"A caryopsis is listed as indehiscent.","a":0,"e":"Both on the lecture list.","topic":"Fruits and seeds","source":"pp. 108–137"},{"p":16,"A":"Legumes and siliques are classified as indehiscent.","B":"Achenes are classified as dehiscent.","a":3,"e":"Both are reversed.","topic":"Fruits and seeds","source":"pp. 108–137"},{"p":16,"A":"A schizocarp appears under the indehiscent group in the worksheet.","B":"A nut appears under the indehiscent group.","a":0,"e":"Both reflect the source worksheet classification.","topic":"Fruits and seeds","source":"pp. 108–137"},{"p":16,"A":"Dry fruits necessarily retain succulent pericarp at maturity.","B":"Dehiscence means the mature fruit remains completely closed.","a":3,"e":"Both false: dry fruits have low moisture and dehiscent fruits open.","topic":"Fruits and seeds","source":"pp. 108–137"},{"p":17,"A":"A berry has broadly soft pericarp layers.","B":"A drupe has a hardened endocarp.","a":0,"e":"Both lecture definitions are correct.","topic":"Fruits and seeds","source":"pp. 108–137"},{"p":17,"A":"A pome develops a core-like papery endocarp.","B":"A pepo has an exocarp modified as a hard rind.","a":0,"e":"Both definitions are correct.","topic":"Fruits and seeds","source":"pp. 108–137"},{"p":17,"A":"A hesperidium is a citrus-type fruit with oil glands.","B":"Coconut is a drupe according to the slides.","a":0,"e":"Both correct.","topic":"Fruits and seeds","source":"pp. 108–137"},{"p":17,"A":"A drupe is defined by a papery endocarp.","B":"A pome is defined by a stony endocarp.","a":3,"e":"Both are swapped: drupe stony, pome papery.","topic":"Fruits and seeds","source":"pp. 108–137"},{"p":17,"A":"A pepo is defined by a hard rind.","B":"All pericarp layers of a berry are described as soft.","a":0,"e":"Both correct.","topic":"Fruits and seeds","source":"pp. 108–137"}],"passages":[{"title":"Leaf attachment and support","text":"A class compares sweet potato (Ipomoea batatas), vanilla orchid (Vanilla planifolia), ginger (Zingiber officinale), and banana (Musa × paradisiaca). Sweet potato has a leaf stalk; vanilla leaves attach without a distinct stalk. Ginger has a leaf base that wraps around the axis. In banana, overlapping leaf sheaths form a pseudostem."},{"title":"Specialized leaves","text":"Students observe garden pea (Pisum sativum) climbing a support, onion (Allium cepa) bulbs, Nepenthes pitchers, and Bryophyllum daigremontianum plantlets. In pea, terminal leaflets become tendrils. Onion fleshy leaves store reserves. Pitchers help obtain nitrogen from prey; Bryophyllum grows young plantlets at the leaf margins."},{"title":"Inside a leaf","text":"A leaf cross-section shows a protective cuticle and epidermis, palisade mesophyll beneath the upper surface, spongy mesophyll with air spaces, xylem and phloem within a vein, and stomata in the epidermis. Light capture, gas exchange, water supply, and sugar export depend on these differentiated tissues."},{"title":"Flower development","text":"A botanical garden examines a flower’s calyx, corolla, stamens, and pistil. The calyx consists of sepals, the corolla of petals, the stamen bears an anther and filament, and the pistil comprises stigma, style, and ovary. Goethe proposed that floral organs represent modified leaflike structures, an idea supported by some homeotic mutants."},{"title":"Fruit origin and maturation","text":"Researchers compare a coconut (Cocos nucifera), a raspberry aggregate, and a pineapple. The mature ovary wall forms the pericarp with exocarp, mesocarp, and endocarp. A simple fruit comes from a single ovary; an aggregate fruit from several unfused carpels in one flower; and a multiple fruit from an inflorescence. Dry fruits can be dehiscent or indehiscent."},{"title":"Leaf surfaces and vascular hierarchy","text":"A botanist draws a leaf with its apex, margin, lamina, midrib, lateral veins, and fine veinlets. The angle where the leaf meets the stem is called an axil. The upper face is adaxial; the lower face is abaxial. The primary vein branches to progressively smaller veins."},{"title":"Leaf attachment and taxonomy","text":"A student compares sweet potato with a petiolate leaf and vanilla with a sessile leaf. Groundnut shows a pair of stipules at the base while Basella lacks them. Banana has a false stem formed from layered sheaths."},{"title":"Climbing and nutrient-seeking leaves","text":"In a garden, pea tendrils coil around a trellis after making contact. An onion bulb stores water and reserves in fleshy leaves. Nepenthes traps insects for nitrogen, and mother-of-thousands produces miniature plantlets along its margins."},{"title":"Mesophyll and transport","text":"A prepared leaf section has cuticle and epidermis externally, differentiated palisade and spongy mesophyll within, plus vascular bundles. Xylem brings water toward the leaf and phloem moves sugars away. Guard cells regulate stomatal apertures."},{"title":"Monocot and dicot anatomy","text":"Two leaf sections show different organization. The first has relatively similar mesophyll on both faces, a pattern associated in the lectures with isobilateral monocot leaves. The second has distinct palisade and spongy regions, typical of dorsiventral dicot leaves."},{"title":"Flower organs and sexuality","text":"A class dissects flowers to locate calyx, corolla, androecium, and gynoecium. The calyx protects the bud, the corolla often attracts pollinators, stamens bear pollen, and carpels contain ovules. A perfect flower has both reproductive sexes."},{"title":"Carpel arrangement and floral attachment","text":"A researcher examines a flower with fused carpels and compares it with another flower with unfused carpels. Some flowers have a visible stalk called a pedicel; others attach directly to the floral axis."},{"title":"ABC model and homeotic mutations","text":"Floral organs form in concentric rings under the ABC developmental model: A alone gives sepals, A+B petals, B+C stamens, and C alone carpels. A B-loss mutant turns whorl-2 organs into sepals and whorl-3 organs into carpels."},{"title":"Fertilization and generations","text":"A flowering plant forms pollen-related microspores in its anthers and a megaspore during ovule development. The sporophyte generation forms spores through meiosis. Pollen tubes help transport sperm toward the female gametophyte; double fertilization produces a zygote and nutritive endosperm."},{"title":"Ovary maturation and fruit tissues","text":"After fertilization a flower ovary matures into a fruit. Its ovary wall becomes the pericarp, differentiating into exocarp, mesocarp, and endocarp; an ovule becomes a seed. A tomato section includes placental tissue, seeds, and surrounding locular gel."},{"title":"Fruit classification decision process","text":"Botanists classify fruits by four ordered questions: how many flowers/carpels originated them, whether the pericarp is fleshy or dry, whether dry fruits open on maturation, and which pericarp layers become rind, core, pit, peel, or flesh."},{"title":"Dry fruit release structures","text":"A field guide divides dry fruits into dehiscent forms such as capsule, legume, silique, and follicle, and indehiscent forms such as achene, caryopsis, samara, schizocarp, and nut. A samara is winged, while a caryopsis is a grain."},{"title":"Fleshy fruit pericarp changes","text":"A mature fruit may have soft pericarp throughout (berry), a papery core (pome), a stony pit (drupe), a thick hard rind (pepo), or a citrus-like leathery peel with oil glands (hesperidium). Coconut is identified as a drupe, not a botanical nut."}]};

const TFOP=[
  "Statement A is true; Statement B is false",
  "Statement B is true; Statement A is false",
  "Both statements are true",
  "Both statements are false"
];
const TFMAP=[2,0,1,3];
const TYPES={tf:"Modified true or false",mc:"Multiple choice",ty:"Typing"};
const TOPIC_LABELS={
  "Leaf morphology":"Leaf morphology",
  "Leaf modifications":"Specialized leaves",
  "Leaf internal anatomy":"Leaf anatomy",
  "Scientific names":"Scientific names",
  "Flowers":"Flowers & reproduction",
  "Fruits and seeds":"Fruits & seeds"
};
const TOPICS=[...new Set([...DATA.mcq,...DATA.typing,...DATA.tf].map(q=>q.topic))];
const BANK=[
  ...DATA.tf.map(q=>({k:"tf",t:q.topic,p:q.p,A:q.A,B:q.B,a:TFMAP[q.a],e:q.e,s:q.source,q:"Evaluate Statement A and Statement B."})),
  ...DATA.mcq.map(q=>({k:"mc",t:q.topic,q:q.q,c:q.o[q.a],w:q.o.filter((_,idx)=>idx!==q.a),e:q.e,s:q.source})),
  ...DATA.typing.map(q=>({k:"ty",t:q.topic,q:q.q,a:q.answers,e:q.e,s:q.source}))
];

const $=id=>document.getElementById(id);
const sel={topics:new Set(TOPICS),types:new Set(["tf","mc","ty"]),len:0};
let pool=[],i=0,log=[],done=false,missedOnly=null;

const shuffle=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s).toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim();
function lev(a,b){
  const m=a.length,n=b.length,d=[];
  for(let x=0;x<=m;x++)d[x]=[x];
  for(let y=0;y<=n;y++)d[0][y]=y;
  for(let x=1;x<=m;x++)for(let y=1;y<=n;y++)
    d[x][y]=Math.min(d[x-1][y]+1,d[x][y-1]+1,d[x-1][y-1]+(a[x-1]===b[y-1]?0:1));
  return d[m][n];
}
function typedOk(g,acc){
  g=norm(g);if(!g)return false;
  return acc.some(a=>{
    a=norm(a);if(g===a)return true;
    const tol=a.length>=12?2:a.length>=6?1:0;
    return tol>0&&lev(g,a)<=tol;
  });
}

/* home */
function matching(){return BANK.filter(q=>sel.topics.has(q.t)&&sel.types.has(q.k))}
function renderHome(){
  const c=k=>BANK.filter(q=>q.k===k).length;
  $("bankSum").textContent=BANK.length+" questions: "+c("tf")+" modified true/false, "+c("mc")+" multiple choice, "+c("ty")+" typing · "+DATA.passages.length+" passages";
  $("topicChips").innerHTML=TOPICS.map(k=>`<button class="chip" data-t="${esc(k)}" aria-pressed="${sel.topics.has(k)}">${esc(TOPIC_LABELS[k]||k)}<span class="n">${BANK.filter(q=>q.t===k).length}</span></button>`).join("");
  $("typeChips").innerHTML=Object.entries(TYPES).map(([k,v])=>`<button class="chip" data-k="${k}" aria-pressed="${sel.types.has(k)}">${v}<span class="n">${c(k)}</span></button>`).join("");
  const n=matching().length;
  $("lenChips").innerHTML=[[0,"All"],[25,"25"],[50,"50"],[100,"100"]].map(([v,l])=>`<button class="chip" data-l="${v}" aria-pressed="${sel.len===v}">${l}</button>`).join("");
  $("poolSum").textContent=n?Math.min(n,sel.len||n)+" of "+n+" matching questions":"Select at least one topic and type";
  $("start").disabled=!n;
}
$("topicChips").onclick=e=>{const b=e.target.closest("[data-t]");if(!b)return;const k=b.dataset.t;sel.topics.has(k)?sel.topics.delete(k):sel.topics.add(k);renderHome()};
$("typeChips").onclick=e=>{const b=e.target.closest("[data-k]");if(!b)return;const k=b.dataset.k;sel.types.has(k)?sel.types.delete(k):sel.types.add(k);renderHome()};
$("lenChips").onclick=e=>{const b=e.target.closest("[data-l]");if(!b)return;sel.len=+b.dataset.l;renderHome()};
$("allTopics").onclick=()=>{sel.topics=new Set(TOPICS);renderHome()};
$("noTopics").onclick=()=>{sel.topics=new Set();renderHome()};
$("start").onclick=()=>{let p=shuffle(matching());if(sel.len)p=p.slice(0,sel.len);begin(p)};

function show(id){["home","quiz","results"].forEach(x=>$(x).hidden=x!==id);window.scrollTo(0,0)}
function begin(p){pool=p;i=0;log=[];show("quiz");renderQ()}

/* question */
function renderQ(){
  const q=pool[i];done=false;
  $("qcount").textContent="Question "+(i+1)+" of "+pool.length;
  $("qscore").textContent=log.filter(x=>x.ok).length+" correct";
  $("qbar").style.width=(i/pool.length*100)+"%";
  $("qtags").innerHTML=`<span class="tag ${q.k}">${TYPES[q.k]}</span><span class="tag topic">${esc(TOPIC_LABELS[q.t]||q.t)}</span>`;
  $("fb").hidden=true;$("secondary").hidden=true;
  $("qsrc").textContent="Lecture reference: "+(q.s||"BBIO101A slides");
  const pre=$("qpre"),body=$("qbody");
  if(q.k==="tf"){
    const p=DATA.passages[q.p];
    pre.innerHTML=`<div class="passage"><div class="ptitle">Passage ${q.p+1}: ${esc(p.title)}</div><p>${esc(p.text)}</p></div>`;
    $("qtext").textContent="Based on the passage, evaluate both statements.";
    body.innerHTML=`<div class="stmts"><div class="stmt"><b>Statement A:</b> ${esc(q.A)}</div><div class="stmt"><b>Statement B:</b> ${esc(q.B)}</div></div><div class="opts">`+TFOP.map((o,n)=>`<button class="opt" data-v="${n}"><span class="k">${"ABCD"[n]}</span><span>${esc(o)}</span></button>`).join("")+`</div>`;
    $("primary").hidden=true;
  }else if(q.k==="mc"){
    pre.innerHTML="";
    $("qtext").textContent=q.q;
    q.opts=shuffle([q.c,...q.w]);
    body.innerHTML=`<div class="opts">`+q.opts.map((o,n)=>`<button class="opt" data-v="${n}"><span class="k">${"ABCD"[n]}</span><span>${esc(o)}</span></button>`).join("")+`</div>`;
    $("primary").hidden=true;
  }else{
    pre.innerHTML="";
    $("qtext").textContent=q.q;
    body.innerHTML=`<input class="ans" id="ans" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type the botanical term…" aria-label="Your answer">`;
    $("primary").hidden=false;$("primary").textContent="Check";$("secondary").hidden=false;
    setTimeout(()=>$("ans")&&$("ans").focus(),30);
  }
}
function finish(ok,given,shown){
  done=true;const q=pool[i];
  log.push({q,ok,given});
  const fb=$("fb");fb.className="fb "+(ok?"good":"bad");fb.hidden=false;
  const why=q.e?`<span class="why">${esc(q.e)}</span>`:"";
  fb.innerHTML=`<b>${ok?"Correct.":"Not quite."}</b> ${shown?esc(shown):""}${why}`;
  $("qscore").textContent=log.filter(x=>x.ok).length+" correct";
  $("primary").hidden=false;$("primary").textContent=i===pool.length-1?"See results":"Next";$("secondary").hidden=true;
  $("primary").focus();
}
$("qbody").onclick=e=>{
  const b=e.target.closest(".opt");if(!b||done)return;const q=pool[i];
  const all=[...document.querySelectorAll("#qbody .opt")];
  if(q.k==="tf"){
    const pick=+b.dataset.v,ok=pick===q.a;
    all.forEach((x,n)=>{x.disabled=true;if(n===q.a)x.classList.add("good")});
    if(!ok)b.classList.add("bad");
    finish(ok,"ABCD"[pick]+". "+TFOP[pick],ok?"":"Answer: "+"ABCD"[q.a]+". "+TFOP[q.a]+".");
  }else if(q.k==="mc"){
    const ci=q.opts.indexOf(q.c),pick=+b.dataset.v,ok=pick===ci;
    all.forEach((x,n)=>{x.disabled=true;if(n===ci)x.classList.add("good")});
    if(!ok)b.classList.add("bad");
    finish(ok,q.opts[pick],ok?"":"Answer: "+q.c+".");
  }
};
function checkTyped(){
  if(done)return;const q=pool[i],inp=$("ans"),g=inp.value;
  if(!g.trim()){inp.focus();return}
  const ok=typedOk(g,q.a);inp.disabled=true;inp.classList.add(ok?"good":"bad");
  finish(ok,g,"Answer: "+q.a[0]+(q.a.length>1?" (also accepted: "+q.a.slice(1).join(", ")+")":"")+".");
}
$("secondary").onclick=()=>{if(done)return;const q=pool[i];$("ans").disabled=true;finish(false,"(skipped)","Answer: "+q.a[0]+(q.a.length>1?" (also accepted: "+q.a.slice(1).join(", ")+")":"")+".")};
$("primary").onclick=()=>{
  if(!done){checkTyped();return}
  if(i===pool.length-1){results();return}
  i++;renderQ();
};
$("quit").onclick=()=>{if(log.length)results();else{show("home");renderHome()}};
document.addEventListener("keydown",e=>{
  if($("quiz").hidden)return;
  if(e.key==="Enter"){if(done||(pool[i]&&pool[i].k==="ty")){e.preventDefault();$("primary").click()}return}
  if(done||e.target.tagName==="INPUT"||e.ctrlKey||e.metaKey)return;
  const q=pool[i];
  if(q.k==="tf"||q.k==="mc"){
    const n="abcd".indexOf(e.key.toLowerCase());
    const m=n>=0?n:"1234".indexOf(e.key);
    const max=q.k==="tf"?4:q.opts.length;
    if(m>=0&&m<max)document.querySelector('[data-v="'+m+'"]').click();
  }
});

/* results */
function rows(groupFn,labels){
  const m={};log.forEach(x=>{const k=groupFn(x.q);(m[k]=m[k]||{n:0,c:0});m[k].n++;if(x.ok)m[k].c++});
  return Object.entries(m).map(([k,v])=>{const p=Math.round(v.c/v.n*100);return `<div class="brow"><span>${esc(labels[k]||k)}</span><div class="bar"><i style="width:${p}%"></i></div><span class="pc">${v.c}/${v.n}</span></div>`}).join("");
}
function results(){
  show("results");
  const c=log.filter(x=>x.ok).length,n=log.length,p=Math.round(c/n*100);
  $("rScore").textContent=p+"%";
  $("rLine").textContent=c+" of "+n+" correct"+(n<pool.length?" (ended early, "+(pool.length-n)+" unanswered)":"")+".";
  $("byType").innerHTML=rows(q=>q.k,TYPES);
  $("byTopic").innerHTML=rows(q=>q.t,TOPIC_LABELS);
  const miss=log.filter(x=>!x.ok);
  missedOnly=miss.map(x=>x.q);
  $("retryMissed").hidden=!miss.length;
  $("missed").innerHTML=miss.length?miss.map(x=>{
    const q=x.q;
    const corr=q.k==="tf"?"ABCD"[q.a]+". "+TFOP[q.a]:q.k==="mc"?q.c:q.a[0];
    const prompt=q.k==="tf"?`Statement A: ${q.A} | Statement B: ${q.B}`:q.q;
    return `<div class="miss"><span class="tag ${q.k}">${TYPES[q.k]}</span> <span class="tag topic">${esc(TOPIC_LABELS[q.t]||q.t)}</span><p>${esc(prompt)}</p><p><span class="ya">You: ${esc(x.given)}</span> &middot; <span class="ca">Answer: ${esc(corr)}</span></p>${q.e?`<p class="sum" style="font-family:var(--body)">${esc(q.e)}</p>`:""}</div>`;
  }).join(""):"<p>No missed questions. Nice work.</p>";
}
$("retryMissed").onclick=()=>begin(shuffle(missedOnly));
$("again").onclick=()=>{show("home");renderHome()};
renderHome();
</script>
</body>
</html>
